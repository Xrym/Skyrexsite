# ==============================================================================
# Skyrex Computers - High-Performance Nginx Configuration
# Оптимизировано под высокую нагрузку, стриминг SSE и прямую отдачу статики
# ==============================================================================

upstream skyrex_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name skyrex.pro www.skyrex.pro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skyrex.pro www.skyrex.pro;

    # SSL сертификаты (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/skyrex.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skyrex.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/skyrex;
    index index.html;

    # Сжатие Gzip для ускорения загрузки и экономии трафика
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml;

    # 1. Прямая отдача статических скриптов и стилей ядром Linux (без задействования Python)
    location ~* ^/(style\.css|app\.js|auth\.js|chat_bot\.js|rig_visualizer\.js)$ {
        root /var/www/skyrex;
        expires 7d;
        add_header Cache-Control "public, no-transform, stale-while-revalidate=604800";
        access_log off;
    }

    # 2. Прямая отдача медиа-файлов, картинок и 3D-ассетов
    location /assets/ {
        alias /var/www/skyrex/assets/;
        expires 14d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 3. Главная страница
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # 4. Потоковый endpoint AI чата (Server-Sent Events) - БЕЗ БУФЕРИЗАЦИИ!
    location /api/chat {
        proxy_pass http://skyrex_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # КРИТИЧНО ДЛЯ SSE: отключение буферизации для мгновенного стриминга токенов
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Остальные API endpoints (авторизация, поиск, компоненты)
    location /api/ {
        proxy_pass http://skyrex_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. Защита служебных файлов от прямого доступа
    location ~* (\.env|\.db|\.sqlite|\.git|\.py|\.sh|\.bat|requirements\.txt)$ {
        deny all;
        return 404;
    }
}
